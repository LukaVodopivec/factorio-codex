[mcp_servers.factorio]
command = "./scripts/start-factorio-mcp"
args = []
enabled = true
required = true
startup_timeout_sec = 15
tool_timeout_sec = 600

[mcp_servers.factorio-readonly]
command = "./scripts/start-factorio-mcp"
args = ["--surface", "read-only"]
enabled_tools = ["connect_status", "map_summary", "progression_status", "production_requirements", "describe_prototype", "observe_local", "inspect_entity", "plan_status"]
enabled = false
required = false
startup_timeout_sec = 15
tool_timeout_sec = 600

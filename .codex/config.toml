[mcp_servers.factorio]
command = "./scripts/start-factorio-mcp"
args = []
enabled = true
required = true
startup_timeout_sec = 180
tool_timeout_sec = 600

[mcp_servers.factorio-readonly]
command = "./scripts/start-factorio-mcp"
args = ["--surface", "read-only"]
enabled_tools = ["connect_status", "map_summary", "progression_status", "production_requirements", "describe_prototype", "observe_local", "inspect_entity", "plan_status", "can_place", "find_placement", "factory_status", "activity_log", "next_event", "build_layout", "build_block", "connect_entities", "blueprint_list", "blueprint_describe", "blueprint_export", "blueprint_place", "place_tiles", "platform_status"]
enabled = false
required = false
startup_timeout_sec = 180
tool_timeout_sec = 600
